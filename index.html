:root {
  --primary: #667eea; --primary-dark: #5568d3; --secondary: #764ba2;
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
  --bg: #f3f4f6; --bg-card: #ffffff; --text: #1f2937; --text-light: #6b7280;
  --border: #e5e7eb; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); --radius: 10px;
}
[data-theme="dark"] {
  --bg: #111827; --bg-card: #1f2937; --text: #f9fafb; --text-light: #9ca3af;
  --border: #374151;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.connection-status {
  position: fixed; top: 10px; right: 10px; padding: 6px 12px;
  border-radius: 20px; font-size: 0.8em; font-weight: 600; z-index: 1000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2); cursor: pointer;
}
.connection-status.connected { background: var(--success); color: white; }
.connection-status.disconnected { background: var(--danger); color: white; }
.connection-status.syncing { background: var(--warning); color: white; }
.connection-status.local { background: var(--info); color: white; }

.loading-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
  z-index: 10000; color: white; flex-direction: column; gap: 20px;
}
.loading-overlay.hidden { display: none; }
.spinner {
  width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.login-box { background: var(--bg-card); padding: 40px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

.user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9em; }
.user-avatar { width: 35px; height: 35px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-weight: bold; }

.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 15px; }
.card h2 { margin-bottom: 15px; font-size: 1.2em; display: flex; align-items: center; gap: 8px; }

.btn-secondary { background: var(--text-light); }
.btn-whatsapp { background: #25D366; }
.btn-block { width: 100%; }

label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85em; }
